<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="timer">
        00: <span id="time">30</span>
    </div>
    

    <script>

        let time = document.getElementById('time').textContent
        let id;

        const startTimer = ()=>{

            id = setInterval(() => {

                if(time == 0){
                    clearInterval(id)
                    return
                }

                time--;

            },1000)
        }

    </script>
</body>
</html>
