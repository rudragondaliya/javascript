<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <div class="todo-container container shadow" id="todo">
        <div class="title-name mt-5 ms-3">
            <h2>To-Do-List</h2>
        </div>
        <div class="mb-3 ms-3 mt-3 d-flex" id="inputBox">
            <input type="text" class="form-control" placeholder="Add Your Text" id="input-field" aria-describedby="emailHelp">
            <button onclick="addBtn()" class="btn w-25" id="addBtn">Add</button>
            
          </div>
        <div class="list-container mt-3">
            <ul class="list-group" id="todo-list"></ul>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
