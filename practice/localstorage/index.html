<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage-data</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary shadow">
            <div class="container-fluid">
              <a class="navbar-brand" href="#"> <span><i class='bx bx-user-circle me-1'></i></span>Rudra Gondaliya</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <form class="d-flex" role="search">
                  <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                  <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
              </div>
            </div>
          </nav>
    </header>

    <!-- main-container -->

    <div class="container-fluid" id="main-container">
        <div class="container-fluid " id="side-container">
            <h3 class="text-white text-center mt-3">Register Here...</h3>
            <form class="mt-5 text-white" id="myform" method="post ">
                <div class="mb-3">
                  <label for="first-nmae" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="first-name" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                  <label for="last-name" class="form-label">Password</label>
                  <input type="password" class="form-control" id="last-name">
                </div>
                <div id="gender">
                  <label class="form-label">Gender:</label> <br>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" value="Male" type="radio" name="gender" id="gender1">
                  <label class="form-check-label" for="gender1">
                    Male
                  </label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" value="Female" type="radio" name="gender" id="gender2">
                  <label class="form-check-label" for="gender2">
                    Female
                  </label>
                </div>
              </div>

              <div class="hobby mt-2">
                <label class="form-label">Hobby:</label> <br>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" value="Dancing" id="hobby1">
                  <label class="form-check-label" for="dance">
                    Dancing
                  </label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" value="Singing" id="flexCheckChecked" checked>
                  <label class="form-check-label" for="sing">
                    Singing
                  </label>
                </div>
              </div>
               
              <div class="city mt-2">
                <label class="form-label">City:</label>
                <select class="form-select" aria-label="Default select example" id="select">
                  <option selected disabled>--city--</option>
                  <option value="Navsari">Navsari</option>
                  <option value="Surat">Surat</option>
                  <option value="Vapi">Vapi</option>
                </select>
              </div>

                <div class="mb-3">
                    <label for="Phone" class="form-label">Phone no:</label>
                    <input type="tel" class="form-control" id="Phone">
                  </div>
                  <div class="sub-btn text-center mt-4">
                <button type="submit" class="btn btn-dark w-50 " id="formBtn">Register</button>
            </div>
              </form>
        </div>
        <div class="contianer-fluid p-3" id="table-container">
            <div class="title-head mt-4 ms-4">
                <h1>Records</h1>
            </div>

            <table class=" table table-striped w-100 justify-content-center" id="table">
                <thead>
                    <tr>
                        <th>Sr.no</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Gender</th>
                        <th>Hobby</th>
                        <th>City</th>
                        <th>Phone.no</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
