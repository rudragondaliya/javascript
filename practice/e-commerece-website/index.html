<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garderobe-ecommerce</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  
  <section class="banner">
    <div class="container-fluid gx-0">
      <div class="img-banner">
        <nav class="navbar navbar-expand-lg bg-body-tertiary" id="header">
          <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="#">Garderobe</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item fw-semibold">
                  <a class="nav-link" aria-current="page" href="#">HOME</a>
                </li>
                <li class="nav-item fw-semibold">
                  <a class="nav-link mx-2" href="#">PRODUCTS</a>
                </li>
                <li class="nav-item fw-semibold">
                  <a class="nav-link" href="#">SERVICES</a>
                </li>
                <li class="nav-item fw-semibold">
                  <a class="nav-link mx-2" href="#">ABOUT US</a>
                </li>
                <li class="nav-item fw-semibold">
                  <a class="nav-link" href="#">NEWS</a>
                </li>
                <li class="nav-item fw-semibold">
                  <a class="nav-link mx-2" href="#">CONTACT</a>
                </li>
              </ul>
              <div class="icons d-flex me-3 ">
                <div class="icon-1 mx-3 fs-5 fw-semibold">
                  <i class="bi bi-search"></i>
                </div>
                <div class="icon-2 mx-3 fs-5 fw-semibold">
                  <i class="bi bi-person-circle"></i>
                </div>
              </div>
            </div>
          </div>
        </nav>

        <!-- banner -->
         <div class="row gx-0">
          <div class="col">
            <div class="banner-text">
               <h1 class="display-3 fw-bold">Brand New</h1>
               <h1 class="display-3 fw-bold">Collection</h1>
               <p class="mt-3">Mauris vitae ultricies leo integer malesuada tempor orci dapibus ultrices diam <br> in arcu cursus euismod purus viverra accumsan.</p>
               <div class="service-providers d-flex ">
                <div class="service-1">
                  <i class="bi bi-check-circle-fill"></i>
                  <span>Top Brands</span>
                </div>
                <div class="service-2 mx-5">
                  <i class="bi bi-check-circle-fill"></i>
                  <span>High Quality</span>
                </div>
                <div class="service-3">
                  <i class="bi bi-check-circle-fill"></i>
                  <span>Free Delivery</span>
                </div>
               </div>
               <button class="btn mt-4 ex-btn text-white p-3">EXPLORE SHOP</button>
            </div>
          </div>
          <div class="col">
            <div class="banner-img">
              <img  id="main-img" src="./img/home-banner.webp" alt="">
            </div>
          </div>
         </div>

      </div>
    </div>
  </section>



  
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="./script.js"></script>
</body>
</html>
