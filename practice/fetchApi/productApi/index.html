<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-Api</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <style>
        .card-title{
            font-size: 15px !important;
        }

        .total-box{
          height: 300px;
          width: 100%;
          border: 1px solid;
        }

      
       

    </style>
    
    <nav class="navbar navbar-expand-lg bg-primary-subtle">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item mx-3">
                <a class="nav-link" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>
              <li class="nav-item mx-3">
                <a class="nav-link" aria-disabled="true">Contact</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
            <button class="btn btn-primary-subtle ms-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
              <i class="bi bi-bag-fill"></i>
            </button>
          </div>
        </div>
      </nav>

      <section class="product-data mt-5 p-3">
        <div class="container-fluid" >
            <div class="row justify-content-center g-5" id="root">
                
            </div>
        </div>
      </section>

      <!-- offcanvas -->

      <div class="offcanvas offcanvas-end w-100" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasExampleLabel">Offcanvas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
              <div class="title">
                <h1 class="p-3">Cart</h1>
                <hr>
                <div class="product-details">
                  <div class="row">
                    <div class="col-md-8">
                      <div class="product-table">
                      <table id="table" class="table table-striped mt-3">
                        <thead>
                          <tr>
                            <th>Sr.no</th>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                          </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                      </table>
                    </div>
                    </div>
                    <div class="col-md-4">
                      <div class="total-box mt-3">
                           <div class="title-box">
                            <h3 class="text-start ms-3 mt-3">Cart Totals</h3>
                           </div>
                           <div class="total-cal d-flex align-items-center flex-column"></div>
                           <div class="subtotal text-secondary mt-5 d-flex justify-content-between align-items-center">
                            <h5 class="ms-4">subtotal</h5>
                            <h5 class="me-4 totalbill">$00.00</h5>
                           </div>
                           <hr>
                           <div class="total text-secondary mt-5 d-flex justify-content-between align-items-center">
                            <h5 class="ms-4">total</h5>
                            <h5 class="me-4 totalbill">$00.00</h5>
                           </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
          </div>
        </div>
      </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
