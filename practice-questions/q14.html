<!-- Filter prime numbers -->
 <script>
    const numbers = [2,3,4,5,6,7,8,9,10]
    const isPrime = num => {
        for(let i=2;i<num;i++){
            if(num % i === 0)
            {
                return false
            }
            else{
                return num > 1;
            }
        }
    }

    const primes = numbers.filter(isPrime);
    console.log(primes);
 </script>
