<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login/sign</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div
      class="container mt-4"
    >
      <!-- sign-up-start -->
      <div class="signup" id="form">
        <form method="post">
          <h1 class="text-center mt-5">Sign-up</h1>
          <div class="mb-3 mt-4 w-75 mx-auto">
            <label for="username" class="form-label"
              >Username</label
            >
            <input
              type="username"
              class="form-control"
              id="username"
              aria-describedby="emailHelp"
              required
            />
          </div>
          <div class="mb-3 w-75 mx-auto">
            <label for="email1" class="form-label"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              aria-describedby="emailHelp"
              required
            />
          </div>
          <div class="mb-3 w-75 mx-auto">
            <label for="password" class="form-label"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="password"
              required
            />
          </div>

          <div class="submit-btn text-center">
            <button type="submit" class="btn btn-primary w-50 mt-3">
              Submit
            </button>
          </div>
        </form>
      </div>

      <!-- sign-page-end -->

      <!-- login-page-start -->

      <div class="login" id="form1">
        <form method="post">
          <h1 class="text-center mt-5">Login</h1>
          <div class="mb-3 mt-4 w-75 mx-auto">
            <label for="username1" class="form-label"
              >Username</label
            >
            <input
              type="username"
              class="form-control"
              id="username1"
              aria-describedby="emailHelp"
              required
            />
          </div>
          <div class="mb-3 w-75 mx-auto">
            <label for="email1" class="form-label"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="email1"
              aria-describedby="emailHelp"
              required
            />
          </div>
          <div class="mb-3 w-75 mx-auto">
            <label for="password1" class="form-label"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="password1"
              required
            />
          </div>

          <div class="submit-btn text-center" id="submit">
            <button type="submit" class="btn btn-primary w-50 mt-3">
              Submit
            </button>
          </div>
        </form>
      </div>
      <!-- login-page-end -->

      <div class="col-md-6">
        <div class="card mx-auto text-center " id="card" style="width: 18rem">
          <div class="card-half"></div>
          <img class="profile text-center  img-fluid img-thumbnail rounded-circle"
            src="img/WhatsApp Image 2024-08-20 at 1.29.24 PM (1).jpeg"
            height="200px"
            class="card-img-top"
            alt="..."
          />
          <div class="card-body">
            <h5 class="card-title" id="name"></h5>
            <p class="card-text" id="email-text">
               
            </p>
            <p >I am a Web Developer form Red n White Multimedia Education</p>
            <div class="follow-btn text-center mt-3">
            <button type="submit" class="btn btn-primary w-50 mx-auto">Follow </button>
          </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
