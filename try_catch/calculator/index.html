<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  
    <div class="container">
        <div class="d-flex justify-content-center align-items-center vh-100 flex-column">
            <h2 class="text-black mb-5 fs-1 fw-bold">CALCULATOR</h2>
            <div class="calculator shadow p-3">
                <input type="text" id="display" class="form-control mx-auto text-end" readonly>

                <div class="buttons row row-cols-5 gap-2 mt-2 justify-content-center">
                    <button class="col btn btn-primary">7</button>
                    <button class="col btn btn-primary">8</button>
                    <button class="col btn btn-primary">9</button>
                    <button class="col btn btn-light">+</button>

                    <button class="col btn btn-primary">4</button>
                    <button class="col btn btn-primary">5</button>
                    <button class="col btn btn-primary">6</button>
                    <button class="col btn btn-light">-</button>

                    <button class="col btn btn-primary">1</button>
                    <button class="col btn btn-primary">2</button>
                    <button class="col btn btn-primary">3</button>
                    <button class="col btn btn-light">*</button>

                    <button class="col btn btn-secondary">C</button>
                    <button class="col btn btn-primary">0</button>
                    <button class="col btn btn-primary">=</button>
                    <button class="col btn btn-primary">/</button>
                </div>
            </div>
        </div>
    </div>
 
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="./script.js"></script>
</body>
</html>
