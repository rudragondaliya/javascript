<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
      
      <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6 mt-3">
                <form method="post" id="form" class="w-100 p-5 shadow">
                    <h1 class=" text-center">Sign-up</h1>
                    <div class="mb-3 mx-auto mt-4">
                      <label for="username" class="form-label">Username</label>
                      <input type="username" name="username" class="form-control" id="username" aria-describedby="emailHelp">
                     <span class="d-none">username is Required.</span>
                    </div>
                    <div class="mb-3">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" name="email" class="form-control" id="email">
                    </div>
                    <span class="d-none text-danger">username is Required.</span>
                    <div class="mb-3">
                        <label for="password" class="form-label">password</label>
                        <input type="password" name="password" class="form-control" id="password">
                      </div>
                    <span class="d-none text-danger">username is Required.</span>

                    <div class="gender-section">
                    <div class="row">
                        <div class="col-md-6">
                    <div class="form-label">Gender</div>
                    <div class="mb-3 form-check-inline">
                      <input type="radio" class="form-check-input" value="male" id="gender1" name="gender">
                      <label class="form-check-label" for="gender1">Male</label>
                    </div>
                    <div class="mb-3 form-check-inline">
                        <input type="radio" class="form-check-input" value="female" id="gender1" name="gender">
                        <label class="form-check-label" for="gender1">Female</label>
                      </div>
                      <span class="d-none text-danger">Gender is Required.</span>
                    </div>
                    <div class="col-md-6">
                      <div class="mb-3">
                        <label class="form-label" for="date">Date Of Birth</label>
                        <input type="date" class="form-control" id="date">
                      </div>
                      <span class="d-none text-danger">DOB is Required.</span>
                    </div>
                       
                    </div>
                    </div>



                      <br>
                    <button type="submit" class="btn btn-primary">Submit</button>
                  </form>
            </div>
        </div>
      </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
