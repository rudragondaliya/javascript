<!-- count Vowels -->

<script>
    function countVowels(str) {

      let count = 0;
  
      for (let i=0;i<str.length;i++) {
  
        if (str[i] === "a" || str[i] === "e" || str[i] === "i" || str[i] === "o" || str[i] === "u") {
          count++;
        }
  
      }
      console.log("numbers of vowel: " + count);
    }
  
    let string = countVowels("javascript");
  
    
  </script>
